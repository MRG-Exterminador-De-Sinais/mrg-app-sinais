<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pagamento MRG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:100%;max-width:520px;background:#111;border:2px solid #00ff88;border-radius:18px;padding:20px;text-align:center}
.logo{color:#00ff88;font-size:23px;font-weight:900}.sub{color:#ffaa00;font-weight:900;margin:5px 0 18px}.nome{color:#ddd}
.valor{font-size:28px;font-weight:900;color:#00ff88;margin:14px 0}.status{padding:10px;border-radius:10px;background:#222;color:#ffaa00;font-weight:900}
.qr{width:min(78vw,300px);height:min(78vw,300px);object-fit:contain;background:#fff;border-radius:12px;margin:16px auto;display:block}
.pix{width:100%;min-height:95px;background:#050505;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;word-break:break-all}
.campo{width:100%;padding:14px;border-radius:10px;border:1px solid #555;background:#050505;color:#fff;font-size:17px;margin-top:14px}
.btn{width:100%;border:0;border-radius:10px;padding:14px;margin-top:10px;font-weight:900;font-size:16px;background:#00ff88;color:#000}
.btn:disabled{opacity:.55}.orientacao{font-size:14px;color:#ddd;line-height:1.45;margin-top:16px}.erro{color:#ff6666;font-weight:700;margin-top:10px;line-height:1.35}
.info{font-size:12px;color:#aaa;margin-top:12px;line-height:1.45}.planos{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.plano{display:block;cursor:pointer}.plano input{position:absolute;opacity:0}.plano-corpo{display:flex;min-height:118px;flex-direction:column;justify-content:center;border:1px solid #444;background:#181818;border-radius:12px;padding:10px}
.plano input:checked+.plano-corpo{border:2px solid #00ff88;background:#10251a}.plano-topo{display:flex;justify-content:space-between;align-items:center;gap:6px}
.plano em{font-style:normal;font-size:10px;color:#ffaa00}.plano strong{font-size:21px;color:#00ff88;margin:8px 0}.plano small{font-size:11px;color:#bbb;line-height:1.35}
.escondido{display:none!important}@media(max-width:420px){.planos{grid-template-columns:1fr}.plano-corpo{min-height:auto}}
</style>
</head>
<body>
<main class="box">
  <div class="logo">MRG EXTERMINADOR DE SINAIS</div>
  <div class="sub">PAGAMENTO VIA PIX</div>
  <div id="conteudo"><div class="status">CARREGANDO COBRANÇA...</div></div>
</main>
<script>
const EDGE="https://bflptqejltvwfjhixwpj.supabase.co/functions/v1/rapid-task";
const qs=new URLSearchParams(location.search);
const codigo=qs.get("codigo")||"";
const token=qs.get("token")||"";
const el=document.getElementById("conteudo");
const moeda=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const digitos=v=>String(v||"").replace(/\D/g,"");

async function carregar(){
  if(!codigo||!token){el.innerHTML='<div class="erro">Link de cobrança inválido.</div>';return}
  try{
    const u=EDGE+"?acao=OBTER_PAGAMENTO_PUBLICO&codigo="+encodeURIComponent(codigo)+"&token="+encodeURIComponent(token);
    const r=await fetch(u,{cache:"no-store"});
    const j=await r.json();
    if(!r.ok||!j.sucesso)throw new Error(j.erro||"Cobrança não encontrada.");
    render(j);
  }catch(e){el.innerHTML='<div class="erro">'+esc(e.message||"Não foi possível carregar a cobrança.")+'</div>'}
}
function render(j){
  const c=j.cobranca,e=j.estado,planos=j.planos||[];
  let status=e.pago?"PAGAMENTO CONFIRMADO":e.expirou?"PIX EXPIRADO":e.tem_pix?"AGUARDANDO PAGAMENTO":"ESCOLHA SEU PLANO";
  let h='<div class="nome">'+esc(j.cliente?.nome||"Cliente")+'</div>';
  if(e.tem_pix||e.pago||e.expirou)h+='<div class="valor">'+moeda(c.valor)+'</div>';
  h+='<div class="status" style="color:'+(e.pago?"#00ff88":e.expirou?"#ff6666":"#ffaa00")+'">'+status+'</div>';
  if(e.pode_escolher_plano){
    h+='<div class="orientacao"><b>Escolha o período de acesso antes de gerar o PIX:</b></div><div class="planos">';
    h+=planos.map((o,i)=>'<label class="plano"><input type="radio" name="plano" value="'+o.dias+'" '+(i===0?"checked":"")+'><span class="plano-corpo"><span class="plano-topo"><b>'+o.dias+' DIAS</b><em>'+(o.pct>0?'-'+o.pct+'%':'SEM DESCONTO')+'</em></span><strong>'+moeda(o.total)+'</strong><small>Mensalidades: '+moeda(o.base)+(o.pct>0?' → '+moeda(o.mensalidades):'')+(o.taxas>0?'<br>Inscrição/reinscrição/taxas: '+moeda(o.taxas)+' sem desconto':'')+'</small></span></label>').join("");
    h+='</div><div class="orientacao">Informe o CPF ou CNPJ do responsável pelo pagamento.</div><input id="documento" class="campo" inputmode="numeric" maxlength="18" placeholder="CPF ou CNPJ"><button id="btnGerar" class="btn" onclick="gerarPix()">GERAR PIX DO PLANO ESCOLHIDO</button><div id="erro" class="erro"></div>';
  }
  if(!e.pago&&!e.expirou&&e.tem_pix){
    if(c.qr_code_url)h+='<img class="qr" src="'+esc(c.qr_code_url)+'" alt="QR Code PIX">';
    h+='<textarea id="pix" class="pix" readonly>'+esc(c.pix_copia_cola||"")+'</textarea><button class="btn" onclick="copiarPix()">COPIAR PIX</button>';
    setTimeout(carregar,20000);
  }
  h+='<div class="info">Código: '+esc(c.codigo)+'<br>Expira em: '+esc(c.expira_em?new Date(c.expira_em).toLocaleString("pt-BR"):"-")+'</div>';
  el.innerHTML=h;
}
async function gerarPix(){
  const erro=document.getElementById("erro"),btn=document.getElementById("btnGerar");
  const plano=document.querySelector('input[name="plano"]:checked');
  const documento=digitos(document.getElementById("documento")?.value);
  if(!plano){erro.textContent="Escolha um plano.";return}
  if(documento.length!==11&&documento.length!==14){erro.textContent="Informe um CPF com 11 dígitos ou CNPJ com 14 dígitos.";return}
  btn.disabled=true;btn.textContent="GERANDO PIX...";erro.textContent="";
  try{
    const r=await fetch(EDGE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acao:"FINALIZAR_DOCUMENTO",codigo,token,documento,plano_dias:Number(plano.value)})});
    const j=await r.json();
    if(!r.ok||!j.sucesso)throw new Error(j.erro||"Não foi possível gerar o PIX.");
    await carregar();
  }catch(e){erro.textContent=e.message||"Não foi possível gerar o PIX.";btn.disabled=false;btn.textContent="GERAR PIX DO PLANO ESCOLHIDO"}
}
async function copiarPix(){
  const v=document.getElementById("pix")?.value||"";
  await navigator.clipboard.writeText(v);
  event.target.innerText="PIX COPIADO";
}
carregar();
</script>
</body>
</html>
